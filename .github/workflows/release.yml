name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: TheSongIs-mac.dmg
            artifact_path: app/TheSongIs-mac-*.dmg
          - os: windows-latest
            artifact: TheSongIs-win.zip
            artifact_path: app/TheSongIs-win-*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pywebview pyinstaller

      - name: Build icon + app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd app

          echo "$GITHUB_REF_NAME" > static/version.txt

          brew install librsvg
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do
            rsvg-convert -w $size -h $size static/favicon.svg -o icon.iconset/icon_${size}x${size}.png
          done
          rsvg-convert -w 32   -h 32   static/favicon.svg -o icon.iconset/icon_16x16@2x.png
          rsvg-convert -w 64   -h 64   static/favicon.svg -o icon.iconset/icon_32x32@2x.png
          rsvg-convert -w 256  -h 256  static/favicon.svg -o icon.iconset/icon_128x128@2x.png
          rsvg-convert -w 512  -h 512  static/favicon.svg -o icon.iconset/icon_256x256@2x.png
          rsvg-convert -w 1024 -h 1024 static/favicon.svg -o icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o static/icon.icns

          pyinstaller \
            --windowed \
            --name "The Song Is" \
            --icon static/icon.icns \
            --add-data "templates:templates" \
            --add-data "static:static" \
            app.py

          brew install create-dmg
          create-dmg \
            --volname "The Song Is" \
            --window-size 540 380 \
            --icon-size 128 \
            --app-drop-link 380 185 \
            --icon "The Song Is.app" 160 185 \
            "TheSongIs-mac-${GITHUB_REF_NAME}.dmg" \
            "dist/The Song Is.app"

      - name: Build icon + app (Windows)
        if: runner.os == 'Windows'
        run: |
          cd app

          Set-Content static\version.txt $env:GITHUB_REF_NAME

          $appName = "TheSongIs-win-$env:GITHUB_REF_NAME"
          pyinstaller `
            --windowed `
            --onedir `
            --name $appName `
            --icon static/favicon.ico `
            --add-data "templates;templates" `
            --add-data "static;static" `
            app.py

          # One-file bundles extract to a temporary _MEI directory at runtime.
          # WebView/DLL locks can make PyInstaller fail to remove it on exit.
          Compress-Archive -Path "dist\$appName" -DestinationPath "$appName.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            TheSongIs-mac.dmg/TheSongIs-mac-${{ github.ref_name }}.dmg
            TheSongIs-win.zip/TheSongIs-win-${{ github.ref_name }}.zip
